{{- if not .Values.database.external.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "infrakitchen.database.clusterName" . }}
  {{- include "infrakitchen.metadata" (dict "component" "database" "context" $) | nindent 2 }}
spec:
  instances: {{ .Values.cnpg.cluster.instances }}
  storage:
    size: {{ .Values.cnpg.cluster.storage.size }}
  bootstrap:
    initdb:
      database: {{ .Values.database.name }}
      owner: {{ .Values.database.user }}
      secret:
        name: {{ include "infrakitchen.database.secretName" . }}
{{- end }}
