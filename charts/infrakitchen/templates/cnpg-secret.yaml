{{- if and (not .Values.database.external.enabled) (not .Values.cnpg.bootstrap.existingSecret) }}
{{- $secretName := include "infrakitchen.database.secretName" . }}
{{- $secretObj := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict }}
{{- $secretData := (get $secretObj "data") | default dict }}
{{- $passwordKey := include "infrakitchen.database.secretKey" . }}
{{- $existingPassword := (get $secretData $passwordKey) | default (get $secretData "password") }}
{{- $password := .Values.cnpg.bootstrap.password }}
{{- if and (empty $password) (not (empty $existingPassword)) }}
{{- $password = $existingPassword | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "infrakitchen.labels.standard" . | nindent 4 }}
type: {{ .Values.cnpg.bootstrap.secretType }}
stringData:
  username: {{ .Values.database.user | quote }}
  password: {{ required "cnpg.bootstrap.password is required when cnpg.bootstrap.existingSecret is not set" $password | quote }}
{{- if ne $passwordKey "password" }}
  {{ $passwordKey }}: {{ required "cnpg.bootstrap.password is required when cnpg.bootstrap.existingSecret is not set" $password | quote }}
{{- end }}
{{- end }}
