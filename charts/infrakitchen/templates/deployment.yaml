{{- if .Values.backend.enabled }}
{{- $initContainers := "" }}
{{- if .Values.demo.enabled }}
{{- $initContainers = include "infrakitchen.demoInitContainer" . }}
{{- end }}
{{- $extraEnv := include "infrakitchen.backendEnv" . }}
{{- include "infrakitchen.workload" (dict
      "context" $
      "values" .Values.backend
      "name" (include "infrakitchen.fullname" .)
      "component" "infrakitchen"
      "containerName" "infrakitchen-backend"
      "extraEnv" $extraEnv
      "initContainers" $initContainers) }}
{{- end }}
