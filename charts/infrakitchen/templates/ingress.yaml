{{- if .Values.ingress.enabled }}
{{- $host := include "infrakitchen.tplvalues.render" (dict "value" .Values.ingress.host "context" $) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "infrakitchen.fullname" . }}
  {{- include "infrakitchen.metadata" (dict "component" "infrakitchen" "annotations" .Values.ingress.annotations "context" $) | nindent 2 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ include "infrakitchen.tplvalues.render" (dict "value" .Values.ingress.tls.secretName "context" $) }}
  {{- end }}
  rules:
    - {{- with $host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ .Values.ingress.service_name | default (include "infrakitchen.fullname" .) }}
                port:
                  number: {{ .Values.service.ports.backend }}
{{- end }}
