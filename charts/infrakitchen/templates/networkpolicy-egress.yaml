{{- $rules := .Values.networkPolicy.egressRules }}
{{- if and .Values.networkPolicy.enabled (or $rules.denyConnectionsToExternal $rules.customRules) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-egress" (include "infrakitchen.fullname" .) }}
  {{- include "infrakitchen.metadata" (dict "component" "infrakitchen" "context" $) | nindent 2 }}
spec:
  podSelector:
    matchLabels:
      {{- include "infrakitchen.labels.matchLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- if $rules.denyConnectionsToExternal }}
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector: {}
    {{- end }}
    {{- with $rules.customRules }}
    {{- include "infrakitchen.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
{{- end }}
