{{- $rules := .Values.networkPolicy.ingressRules }}
{{- if and .Values.networkPolicy.enabled (or $rules.namespaceSelector $rules.podSelector $rules.customRules) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "infrakitchen.fullname" . }}
  {{- include "infrakitchen.metadata" (dict "component" "infrakitchen" "context" $) | nindent 2 }}
spec:
  podSelector:
    matchLabels:
      {{- include "infrakitchen.labels.matchLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if or $rules.namespaceSelector $rules.podSelector }}
    - from:
        {{- with $rules.namespaceSelector }}
        - namespaceSelector:
            matchLabels:
              {{- include "infrakitchen.tplvalues.render" (dict "value" . "context" $) | nindent 14 }}
        {{- end }}
        {{- with $rules.podSelector }}
        - podSelector:
            matchLabels:
              {{- include "infrakitchen.tplvalues.render" (dict "value" . "context" $) | nindent 14 }}
        {{- end }}
      ports:
        - port: {{ .Values.backend.containerPorts.backend }}
          protocol: TCP
    {{- end }}
    {{- with $rules.customRules }}
    {{- include "infrakitchen.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
{{- end }}
