{{- if .Values.scheduler.enabled }}
{{- include "infrakitchen.workload" (dict
      "context" $
      "values" .Values.scheduler
      "name" (printf "%s-scheduler" (include "infrakitchen.fullname" .))
      "component" "infrakitchen-scheduler"
      "containerName" "infrakitchen-scheduler") }}
{{- end }}
