{{- if empty .Values.secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "infrakitchen.fullname" . }}-secrets
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/component: infrakitchen
    {{- if .Values.commonLabels }}
    {{- include "infrakitchen.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  annotations:
    "helm.sh/resource-policy": "keep"
    {{- if .Values.commonAnnotations }}
    {{- include "infrakitchen.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
    {{- end }}
type: Opaque
data:
  {{- /* Look up the existing secret so upgrades can reuse generated values */}}
  {{- $secretName := printf "%s-secrets" (include "infrakitchen.fullname" .) }}
  {{- $secretObj := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict }}
  {{- $secretData := (get $secretObj "data") | default dict }}

  {{- /* Generate or reuse jwt-secret */}}
  {{- $jwtSecret := (get $secretData "jwt-secret") | default (randAlphaNum 32 | b64enc) }}
  jwt-secret: {{ $jwtSecret | quote }}

  {{- /* Reuse an existing Fernet key on upgrade; require one only when bootstrapping a new secret */}}
  {{- $encSecret := get $secretData "enc-secret" }}
  {{- if empty $encSecret }}
  {{- $encSecret = (.Values.secrets.encSecret | required "A Fernet key is required at .Values.secrets.encSecret." | b64enc) }}
  {{- end }}
  enc-secret: {{ $encSecret | quote }}
{{- end }}
