{{- if .Values.backend.enabled }}
{{- $type := .Values.service.type }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "infrakitchen.fullname" . }}
  {{- include "infrakitchen.metadata" (dict "component" "infrakitchen" "annotations" .Values.service.annotations "context" $) | nindent 2 }}
spec:
  type: {{ $type }}
  {{- if and .Values.service.clusterIP (eq $type "ClusterIP") }}
  clusterIP: {{ .Values.service.clusterIP }}
  {{- end }}
  {{- if or (eq $type "LoadBalancer") (eq $type "NodePort") }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy | quote }}
  {{- end }}
  {{- if eq $type "LoadBalancer" }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- end }}
  {{- with .Values.service.sessionAffinity }}
  sessionAffinity: {{ . }}
  {{- end }}
  ports:
    - name: {{ .Values.service.ports.name }}
      port: {{ .Values.service.ports.backend }}
      targetPort: {{ .Values.service.ports.targetPort }}
      protocol: TCP
      {{- if and (or (eq $type "NodePort") (eq $type "LoadBalancer")) .Values.service.nodePorts.backend }}
      nodePort: {{ .Values.service.nodePorts.backend }}
      {{- end }}
    {{- with .Values.service.extraPorts }}
    {{- include "infrakitchen.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  selector:
    {{- include "infrakitchen.labels.matchLabels" . | nindent 4 }}
    app.kubernetes.io/component: infrakitchen
{{- end }}
