{{- if or .Values.serviceAccount.create .Values.workerOnDemand.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "infrakitchen.serviceAccountName" . }}
  {{- include "infrakitchen.metadata" (dict "component" "infrakitchen" "labels" .Values.serviceAccount.labels "annotations" .Values.serviceAccount.annotations "context" $) | nindent 2 }}
automountServiceAccountToken: {{ or .Values.serviceAccount.automountServiceAccountToken .Values.workerOnDemand.enabled }}
{{- end }}
