## @section Traffic Exposure parameters

## Service parameters
##
# -- Service parameters
# @default -- See below
service:
  # -- Kubernetes Service type
  type: ClusterIP

  # -- Infrakitchen svc port for client connections
  ports:
    backend: 8080

    # -- Infrakitchen svc port name
    name: http-backend

    # -- Infrakitchen svc target port referencing receiving pod container port
    targetPort: backend

  # -- Node port for the Infrakitchen client connections
  # Choose port between `30000-32767`
  nodePorts:
    backend: ""

  # -- Control where client requests go, to the same pod or round-robin
  # (values: `ClientIP` or `None`)
  # <br /> Ref: https://kubernetes.io/docs/concepts/services-networking/service/#session-stickiness
  sessionAffinity: None

  # -- Infrakitchen service Cluster IP
  #
  # <br /> E.g `clusterIP: None`
  clusterIP: ""

  # -- Infrakitchen service Load Balancer IP
  #
  # <br /> Ref: https://kubernetes.io/docs/concepts/services-networking/service/#loadbalancer
  loadBalancerIP: ""

  # -- Load Balancer sources
  #
  # <br /> Ref: https://kubernetes.io/docs/concepts/services-networking/service/#loadbalancer
  # <br /> E.g `loadBalancerSourceRanges: [10.10.10.0/24]`
  loadBalancerSourceRanges: []

  # -- Infrakitchen service external traffic policy
  #
  # Ref: https://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/#preserving-the-client-source-ip
  externalTrafficPolicy: Cluster

  # -- Additional custom annotations for Infrakitchen service
  annotations: {}

  # -- Extra ports to expose in the Infrakitchen service (normally used with the `sidecar` value)
  extraPorts: []

## @section NetworkPolicy parameters
##
networkPolicy:
  # -- Specifies whether a NetworkPolicy should be created
  enabled: false

  ## Ingress Rules
  ##
  ingressRules:
    # -- Namespace selector label allowed to access the Infrakitchen instance
    namespaceSelector: {}

    # -- Pod selector label allowed to access the Infrakitchen instance
    podSelector: {}

    # -- Additional custom ingress rules
    customRules: []
    #   - to:
    #       - namespaceSelector:
    #           matchLabels:
    #             label: example

  ## Egress Rules
  ##
  egressRules:
    # -- Deny external connections. Should not be enabled when working with an external database.
    denyConnectionsToExternal: false

    # -- Additional custom egress rules
    customRules: []
    #   - to:
    #       - namespaceSelector:
    #           matchLabels:
    #             label: example

# -- Database connection settings consumed by InfraKitchen workloads.
# @default -- See below
database:
  # -- Database name used by the application.
  name: infrakitchen

  # -- Database user used by the application.
  user: infrakitchen

  # -- Database port used by the application.
  port: 5432

  # -- The password key in the Kubernetes Secret consumed by InfraKitchen workloads.
  passwordKey: password

  # -- Run database migrations from the backend deployment.
  applyMigrations: true

  external:
    # -- Use an externally managed PostgreSQL database instead of a CNPG cluster created by this chart.
    enabled: false

    # -- Hostname of the external PostgreSQL database. Required when external mode is enabled.
    host: ""

    # -- Existing secret containing the external database password. Required when external mode is enabled.
    existingSecret: ""

    # -- Key inside the external database secret containing the password.
    passwordKey: password

# -- CloudNativePG cluster settings managed by this chart.
# @default -- See below
cnpg:
  cluster:
    # -- Set a custom name for the CNPG cluster. Defaults to `<release>-infrakitchen-db`.
    name: ""

    # -- Number of PostgreSQL instances in the CNPG cluster.
    instances: 1

    storage:
      # -- Persistent volume size for each CNPG instance.
      size: 4Gi

  bootstrap:
    # -- Existing secret containing the bootstrap/application credentials.
    # The Secret must provide `username` and `password` keys and the username must match `database.user`.
    existingSecret: ""

    # -- Password used for the application database user when creating a new secret.
    # Required when `cnpg.bootstrap.existingSecret` is empty.
    password: ""

    # -- Kubernetes secret type for the generated CNPG bootstrap secret.
    secretType: kubernetes.io/basic-auth

rabbitmq:
  cluster:
    # -- Name of the managed RabbitmqCluster resource.
    name: ""

    # -- Number of RabbitMQ replicas.
    replicas: 1

    persistence:
      # -- Enable persistent storage for the managed RabbitMQ cluster.
      enabled: false

      # -- Size of the RabbitMQ persistent volume claim.
      storage: 4Gi

    resources: {}

    # -- Additional RabbitMQ configuration appended to rabbitmq.conf.
    additionalConfig: |-
      consumer_timeout = 144000000

  auth:
    # -- Existing secret containing RabbitMQ credentials for managed RabbitMQ.
    # The Secret must provide `username` and `password` keys.
    # If not set, the chart uses the operator-generated `<cluster>-default-user` secret.
    existingSecret: ""

    # -- RabbitMQ username for the managed cluster when supplying your own secret.
    username: ""

    # -- RabbitMQ password for the managed cluster when supplying your own secret.
    password: ""

  external:
    # -- Use an external RabbitMQ instance instead of rendering a RabbitmqCluster.
    enabled: false

    # -- RabbitMQ connection URI used when `rabbitmq.external.enabled` is true.
    # If set, no RabbitMQ credential secret is referenced by the application pods.
    uri: ""

    # -- Existing secret containing external RabbitMQ credentials.
    # Used when `rabbitmq.external.uri` is not set. The Secret must provide
    # `username` and `password` keys.
    existingSecret: ""

    # -- External RabbitMQ hostname used when `rabbitmq.external.uri` is not set.
    host: ""

    # -- External RabbitMQ port used when `rabbitmq.external.uri` is not set.
    port: 5672

# -- Service Account Configuration
# @default -- See below
serviceAccount:
  # -- Enable the creation of a ServiceAccount for Infrakitchen pods
  create: false

  # -- Name of the ServiceAccount to use
  # If not set and `serviceAccount.create` is true, a name is generated
  name: ""

  # -- Additional custom labels to the service ServiceAccount.
  labels: {}

  # -- Additional custom annotations for the ServiceAccount.
  annotations: {}

  # -- Auto-mount the service account token in the pod
  automountServiceAccountToken: true

