# Default values for the Infrakitchen chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Global parameters
global:
  # -- Global Docker image registry
  imageRegistry: ""

  # -- Global Docker image tag shared by all InfraKitchen workloads unless overridden per workload.
  # Defaults to the chart `appVersion` when empty.
  imageTag: ""

  # -- Global Docker registry secret names as an array
  # </br> E.g. `imagePullSecrets: [myRegistryKeySecretName]`
  imagePullSecrets: []

# -- Common parameters

# -- String to partially override the generated release fullname
nameOverride: ""

# -- String to fully override the generated release fullname
fullnameOverride: ""

# -- Labels to add to all deployed objects
commonLabels: {}

# -- Annotations to add to all deployed objects
commonAnnotations: {}

# -- Array of extra objects to deploy with the release
extraDeploy: []

# -- Name of an existing Secret providing `jwt-secret` and `enc-secret` keys.
# When set, the chart does not create its own application Secret.
secretName: ""

secrets:
  # -- Fernet-compatible encryption key used for ENCRYPTION_KEY. The chart base64-encodes it for Secret.data.
  encSecret: ""

mcp:
  # -- Enable the MCP server in the backend.
  enabled: true

demo:
  # -- Run demo fixture generation as a backend init container before the app starts.
  enabled: false

# -- Ingress parameters
ingress:
  # -- Enable the creation of the ingress resource
  enabled: false

  # -- Name of the IngressClass cluster resource which defines which controller will implement the resource (e.g nginx)
  className: ""

  # -- Additional annotations for the Ingress resource
  annotations: {}

  # -- Hostname to be used to expose the route to access the infrakitchen application (e.g: infrakitchen.IP.nip.io)
  host: ""

  # -- Path to be used to expose the full route to access the infrakitchen application (e.g: IP.nip.io/infrakitchen)
  path: "/"

  # -- Ingress path type (`Prefix`, `Exact` or `ImplementationSpecific`)
  pathType: Prefix

  # -- Ingress TLS parameters
  tls:
    # -- Enable TLS configuration for the host defined at `ingress.host` parameter
    enabled: false

    # -- The name to which the TLS Secret will be called
    secretName: ""

  # -- Override the backend Service name targeted by the Ingress
  service_name: ""

## InfraKitchen Backend parameters
##
# -- InfraKitchen parameters
# @default -- See below
backend:
  # -- Switch to enable or disable the backend deployment
  enabled: true

  # -- Number of deployment replicas
  replicas: 1

  # -- Define the [count of deployment revisions](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#clean-up-policy) to be kept.
  # May be set to 0 in case of GitOps deployment approach.
  revisionHistoryLimit: 10

  # -- Deployment update strategy
  # <br /> Ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
  strategy: {}

  image:
    # -- Infrakitchen image registry
    registry: "docker.io"

    # -- Infrakitchen image repository
    repository: "rustyrien/infrakitchen"

    # -- Infrakitchen image tag (immutable tags are recommended)
    tag: ""

    # -- Infrakitchen image digest (digest takes precedence over image tag)
    digest: ""

    # -- Image pull policy. Use `Always` only with mutable tags.
    # <br /> Ref: https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
    pullPolicy: IfNotPresent

    # -- Optionally specify an array of imagePullSecrets.
    #  Secrets must be manually created in the namespace.
    # <br /> Ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
    # <br /> E.g: `pullSecrets: [myRegistryKeySecretName]`
    pullSecrets: []

  # -- Container ports on the Deployment
  containerPorts:
    backend: 8080

  # -- Infrakitchen container command
  command: ""

  # -- Infrakitchen container command arguments
  args: []

  # -- Deployment sidecars
  extraContainers: []

  # -- Infrakitchen container environment variables
  extraEnvVars:
    - name: SESSION_EXPIRATION
      value: "86400"

  # -- Infrakitchen container init containers
  initContainers: []

  # -- Resource requests/limits
  # <br /> Ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/#resource-requests-and-limits-of-pod-and-container
  # <!-- E.g.
  # resources:
  #   limits:
  #     memory: 1Gi
  #     cpu: 1000m
  #   requests:
  #     memory: 250Mi
  #     cpu: 100m -->
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 1024Mi

  # -- Readiness Probe
  # <!-- E.g.
  # readinessProbe:
  #   failureThreshold: 3
  #   httpGet:
  #     path: /healthcheck
  #     port: backend
  #     scheme: HTTP
  #   initialDelaySeconds: 30
  #   periodSeconds: 10
  #   successThreshold: 2
  #   timeoutSeconds: 2
  readinessProbe:
    httpGet:
      path: /healthcheck
      port: backend
    failureThreshold: 10
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1

  # -- Liveness Probe
  # <!-- E.g.
  # livenessProbe:
  #   failureThreshold: 3
  #   httpGet:
  #     path: /healthcheck
  #     port: backend
  #     scheme: HTTP
  #   initialDelaySeconds: 60
  #   periodSeconds: 10
  #   successThreshold: 1
  #   timeoutSeconds: 2
  livenessProbe:
    httpGet:
      path: /healthcheck
      port: backend
    failureThreshold: 10
    initialDelaySeconds: 10
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1

  # -- Startup Probe
  # <br /> Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes
  # <!-- E.g.
  # startupProbe:
  #   failureThreshold: 3
  #   httpGet:
  #     path: /healthcheck
  #     port: backend
  #     scheme: HTTP
  #   initialDelaySeconds: 60
  #   periodSeconds: 10
  #   successThreshold: 1
  #   timeoutSeconds: 2
  startupProbe: {}

  # -- Security settings for a Pod.
  #  The security settings that you specify for a Pod apply to all Containers in the Pod.
  # <br /> Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  # -- Security settings for a Container.
  # <br /> Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
  # `readOnlyRootFilesystem` is not enabled because nginx, tofu and git write to the image filesystem.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # -- Affinity for pod assignment
  # <br /> Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
  affinity: {}

  # -- Node labels for pod assignment
  # <br /> Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
  nodeSelector: {}

  # -- Node tolerations for server scheduling to nodes with taints
  # <br /> Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  tolerations: []
  #  - key: "key"
  #    operator: "Equal|Exists"
  #    value: "value"
  #    effect: "NoSchedule|PreferNoSchedule|NoExecute"

  # -- Annotations to add to the pods
  podAnnotations: {}

  # -- Labels to add to the pods
  podLabels: {}

  # -- Additional custom annotations for the `Deployment` resource
  annotations: {}

  # -- Mount the ServiceAccount token into the pods
  automountServiceAccountToken: false

  # -- Topology spread constraints for pod assignment
  # <br /> Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
  topologySpreadConstraints: []

  # -- Priority class name for the pods
  priorityClassName: ""

  # -- Seconds the pods are given to shut down gracefully
  terminationGracePeriodSeconds: 30

  # -- Extra `envFrom` sources (ConfigMaps or Secrets) for the main container
  extraEnvVarsFrom: []

  # -- Extra volumes for the pods
  extraVolumes: []

  # -- Extra volume mounts for the main container
  extraVolumeMounts: []

  # -- PodDisruptionBudget for the backend
  pdb:
    # -- Create a PodDisruptionBudget
    enabled: false

    # -- Minimum number of available pods (number or percentage)
    minAvailable: 1

    # -- Maximum number of unavailable pods (number or percentage); used instead of `minAvailable` when set
    maxUnavailable: null

