  affinity: {}

  # -- Node labels for pod assignment
  # <br /> Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
  nodeSelector: {}

  # -- Node tolerations for server scheduling to nodes with taints
  # <br /> Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
  tolerations: []
  #  - key: "key"
  #    operator: "Equal|Exists"
  #    value: "value"
  #    effect: "NoSchedule|PreferNoSchedule|NoExecute"

  # -- Annotations to add to the pods
  podAnnotations: {}

  # -- Labels to add to the pods
  podLabels: {}

  # -- Additional custom annotations for the `Deployment` resource
  annotations: {}

  # -- Mount the ServiceAccount token into the pods
  automountServiceAccountToken: false

  # -- Topology spread constraints for pod assignment
  # <br /> Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
  topologySpreadConstraints: []

  # -- Priority class name for the pods
  priorityClassName: ""

  # -- Seconds the pods are given to shut down gracefully
  terminationGracePeriodSeconds: 30

  # -- Extra `envFrom` sources (ConfigMaps or Secrets) for the main container
  extraEnvVarsFrom: []

  # -- Extra volumes for the pods
  extraVolumes: []

  # -- Extra volume mounts for the main container
  extraVolumeMounts: []
